<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GroupSync Evidence Panel</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 640px;
        max-height: 600px;
        overflow-y: auto;
        padding: 16px;
        color: #202124;
        background: #fff;
      }
      .gs-status { font-size: 12px; color: #5f6368; padding: 8px 0; }

      .gs-button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .gs-button:disabled { cursor: default; opacity: 0.6; }

      .gs-disclaimer {
        font-size: 11.5px;
        font-style: italic;
        color: #5f6368;
        border-left: 3px solid #dadce0;
        padding: 4px 10px;
        margin: 8px 0;
      }
      .gs-narration { margin-bottom: 12px; }
      .gs-narration .gs-section { margin-bottom: 10px; }
      .gs-narration ul { margin: 4px 0 0 18px; padding: 0; }
      .gs-rule-id { color: #9aa0a6; font-size: 10.5px; font-family: "SF Mono", Menlo, Consolas, monospace; }

      .gs-name-labeling {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      .gs-name-labeling p { margin: 0 0 8px; }
      .gs-name-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .gs-author-id {
        flex: 1;
        font: 11px "SF Mono", Menlo, Consolas, monospace;
        color: #5f6368;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gs-name-input {
        font: inherit;
        width: 180px;
        padding: 4px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }

      .gs-json {
        margin: 0;
        max-height: 480px;
        overflow: auto;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 8px;
        padding: 12px 14px;
        font: 11.5px/1.5 "SF Mono", Menlo, Consolas, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="gs-root">
      <p class="gs-status">Loading…</p>
    </div>
    <script type="module" src="../../dist/popup.js"></script>
  </body>
</html>
